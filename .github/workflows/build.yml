name: Build Zyfer APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and patch
        run: |
          flutter create --platforms=android --org com.zyfer app
          rm -rf app/test
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          cp -r assets/* app/assets/ 2>/dev/null || true
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>' $M
          sed -i 's#<queries>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>#' $M
          K=app/android/app/src/main/kotlin/com/zyfer/app
          mkdir -p $K
          cat > $K/MainActivity.kt <<'EOF'
          package com.zyfer.app

          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.provider.AlarmClock
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private fun norm(s: String) = s.lowercase().filter { it.isLetterOrDigit() }

              private fun openApp(name: String): String? {
                  val pm = packageManager
                  val q = norm(name)
                  if (q.isEmpty()) return null
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  var best: String? = null
                  var bestPkg: String? = null
                  var bestScore = 0
                  for (r in pm.queryIntentActivities(i, 0)) {
                      val label = r.loadLabel(pm).toString()
                      val l = norm(label)
                      val score = when {
                          l == q -> 3
                          l.startsWith(q) -> 2
                          l.contains(q) || (l.length >= 3 && q.contains(l)) -> 1
                          else -> 0
                      }
                      if (score > bestScore) {
                          bestScore = score
                          best = label
                          bestPkg = r.activityInfo.packageName
                      }
                  }
                  if (bestPkg == null) return null
                  val launch = pm.getLaunchIntentForPackage(bestPkg) ?: return null
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(launch)
                  return best
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "zyfer/audio")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "mute", "unmute" -> {
                                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                  val dir = if (call.method == "mute") AudioManager.ADJUST_MUTE else AudioManager.ADJUST_UNMUTE
                                  var ok = true
                                  for (s in intArrayOf(AudioManager.STREAM_NOTIFICATION, AudioManager.STREAM_SYSTEM)) {
                                      try { am.adjustStreamVolume(s, dir, 0) } catch (e: Exception) { ok = false }
                                  }
                                  result.success(ok)
                              }
                              "openApp" -> {
                                  try { result.success(openApp(call.argument<String>("name") ?: "")) }
                                  catch (e: Exception) { result.success(null) }
                              }
                              "setAlarm" -> {
                                  try {
                                      val i = Intent(AlarmClock.ACTION_SET_ALARM)
                                          .putExtra(AlarmClock.EXTRA_HOUR, call.argument<Int>("hour") ?: 0)
                                          .putExtra(AlarmClock.EXTRA_MINUTES, call.argument<Int>("minute") ?: 0)
                                          .putExtra(AlarmClock.EXTRA_MESSAGE, "Zyfer")
                                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      startActivity(i)
                                      result.success(true)
                                  } catch (e: Exception) { result.success(false) }
                              }
                              "setTimer" -> {
                                  try {
                                      val i = Intent(AlarmClock.ACTION_SET_TIMER)
                                          .putExtra(AlarmClock.EXTRA_LENGTH, call.argument<Int>("seconds") ?: 60)
                                          .putExtra(AlarmClock.EXTRA_MESSAGE, "Zyfer")
                                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      startActivity(i)
                                      result.success(true)
                                  } catch (e: Exception) { result.success(false) }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          EOF
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Zyfer-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
